name: Tests

on:
  push:
    paths-ignore:
      - '**.md'

jobs:
  test-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@v3
      - name: Run federicocarboni/setup-ffmpeg
        uses: ./
        with:
          architecture: arm64
      - name: Run federicocarboni/setup-ffmpeg
        uses: ./
        with:
          architecture: arm64
      - run: which ffmpeg
      - run: which ffprobe

  test-git:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 2

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v3
      - name: Run federicocarboni/setup-ffmpeg
        uses: ./
        with:
          ffmpeg-version: git
      - name: Run federicocarboni/setup-ffmpeg
        uses: ./
        with:
          ffmpeg-version: git
      - run: ffmpeg -version
      - run: ffprobe -version

  test-release:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 2

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v3
      - name: Run federicocarboni/setup-ffmpeg
        uses: ./
      - name: Run federicocarboni/setup-ffmpeg
        uses: ./
      - run: ffmpeg -version
      - run: ffprobe -version

  test-shared:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 2

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v3
      - name: Run federicocarboni/setup-ffmpeg
        uses: ./
        with:
          ffmpeg-version: '8'
          linking-type: shared
      - name: Run federicocarboni/setup-ffmpeg
        id: setup-ffmpeg
        uses: ./
        with:
          ffmpeg-version: '8'
          linking-type: shared
      - run: ffmpeg -version
      - run: ffprobe -version
      - run: dir ${{ steps.setup-ffmpeg.outputs.ffmpeg-path }}
